name: Dnevnik
options:
  bundleIdPrefix: org.opendnevnik
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  Dnevnik:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/DnevnikShared.xcframework
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Дневник
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opendnevnik.ios
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 4
